[supervisord]
nodaemon=true

[program:mateus-exp0]
command=/usr/local/bin/python3 /mateus-exp0/client.py

[program:synapse]
command=/start-synapse.py

[program:proxy]
command=/proxy/bin/coap-proxy --maps-dir /proxy/maps --debug-log

[program:node_exporter]
command=/bin/node_exporter --collector.disable-defaults --collector.arp --collector.netclass --collector.netdev

[program:topologiser]
command=/topologiser
