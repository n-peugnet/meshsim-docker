[supervisord]
nodaemon=true

[program:synapse]
command=/start-synapse.py

[program:proxy]
command=/proxy/bin/coap-proxy --maps-dir /proxy/maps --debug-log

[program:node_exporter]
command=/bin/node_exporter

[program:tinyproxy]
command=/usr/bin/tinyproxy -d -c /etc/tinyproxy/tinyproxy.conf

[program:topologiser]
command=/topologiser
